# Builds split APKs on every push to main and uploads them to a rolling
# "nightly" pre-release so the latest build is always downloadable.

name: nightly

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_PATH: commet

jobs:
  build-android-split:
    runs-on: ubuntu-latest
    steps:
      # Free disk space — CI runners are tight on storage
      - name: Aggressive cleanup
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/julia*
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /opt/microsoft /opt/google
          sudo rm -rf /opt/az
          sudo rm -rf /opt/hostedtoolcache
          docker system prune -af || true
          docker builder prune -af || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.8.0
        with:
          flutter-version: '3.41.1'
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv ffmpeg

      - name: Code Generation
        run: |
          cd $PROJECT_PATH
          dart run scripts/codegen.dart

      # Build per-ABI split APKs (arm64-v8a, armeabi-v7a, x86_64)
      - name: Build Split APKs
        run: |
          cd $PROJECT_PATH
          flutter build apk \
            --split-per-abi \
            --release \
            --dart-define PLATFORM=android \
            --dart-define BUILD_MODE=release \
            --dart-define GIT_HASH=${{ github.sha }} \
            --dart-define VERSION_TAG=nightly \
            --dart-define BUILD_DATE=$(date +%s)000 \
            --dart-define BUILD_DETAIL=nightly

      # Rename APKs for clarity in the release assets list
      - name: Rename APKs
        run: |
          cd $PROJECT_PATH/build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk commet-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk commet-armeabi-v7a.apk
          mv app-x86_64-release.apk commet-x86_64.apk

      # Upload all three APKs as build artifacts (always available)
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: commet-split-apks
          path: |
            commet/build/app/outputs/flutter-apk/commet-arm64-v8a.apk
            commet/build/app/outputs/flutter-apk/commet-armeabi-v7a.apk
            commet/build/app/outputs/flutter-apk/commet-x86_64.apk

      # Create or update a rolling "nightly" pre-release with the split APKs.
      # softprops/action-gh-release replaces existing assets on each push so
      # the release always points to the latest build.
      - name: Update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Build"
          body: |
            Automated nightly build from `main` branch.

            **Commit**: ${{ github.sha }}
            **Built**: ${{ github.event.head_commit.timestamp }}

            ### APK Downloads
            | ABI | Description |
            |-----|-------------|
            | `arm64-v8a` | Modern 64-bit ARM devices (most phones since ~2017) |
            | `armeabi-v7a` | Older 32-bit ARM devices |
            | `x86_64` | x86 emulators and ChromeOS |

            > These are unsigned debug-key builds from the latest commit.
            > For signed release builds, see the [latest release](../../releases/latest).
          prerelease: true
          make_latest: false
          files: |
            commet/build/app/outputs/flutter-apk/commet-arm64-v8a.apk
            commet/build/app/outputs/flutter-apk/commet-armeabi-v7a.apk
            commet/build/app/outputs/flutter-apk/commet-x86_64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
