on: push
name: integration-test

env:
  HOMESERVER: localhost
  USER1_NAME: alice
  USER1_PW: AliceInWonderLand
  USER2_NAME: bob
  USER2_PW: CanWeFixIt
  PROJECT_PATH: commet
  # Software rendering for headless CI (no GPU)
  LIBGL_ALWAYS_SOFTWARE: '1'
  FLUTTER_LINUX_RENDERER: software

jobs:
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout  ┏━┓ ︵ /(^.^/)
        uses: actions/checkout@v4
        with:
          submodules: 'true'
        
      - name: Setup Flutter  ╰(✿˙ᗜ˙)੭━☆ﾟ.*･｡ﾟ
        uses: subosito/flutter-action@v2.8.0
        with:
          flutter-version: '3.41.1'
          channel: 'stable'

      - name: Setup Tools  ᕙ|” ◉ ◡ ◉ “|ᕗ
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv ffmpeg libmimalloc-dev webkit2gtk-4.1 keybinder-3.0 \
            libegl1-mesa-dev libgles2-mesa-dev libgl1-mesa-dri

      - name: Start Synapse  [◯ ‸ ◯]
        run: |
          cd $PROJECT_PATH
          scripts/integration-server-synapse.sh

      - name: Configure Synapse  ╰[ ⁰﹏⁰ ]╯
        run: |
          cd $PROJECT_PATH
          scripts/integration-prepare-homeserver.sh

      - name: Configure Flutter (∩｀-´)⊃━☆ﾟ.*･｡ﾟ
        run: flutter config --enable-linux-desktop
        
      - name: Code Generation __φ(．．;)
        run: |
          cd $PROJECT_PATH
          dart run scripts/codegen.dart

      - name: Create l10n shim for integration tests
        run: |
          mkdir -p $PROJECT_PATH/integration_test/generated
          echo "export 'package:commet/generated/l10n.dart';" > $PROJECT_PATH/integration_test/generated/l10n.dart

      - name: Run Unit Tests  ε=ε=┌( >_<)┘
        run: |
          cd $PROJECT_PATH
          scripts/unit-test.sh

      - name: Build Linux binary
        run: |
          cd $PROJECT_PATH
          flutter build linux --debug \
            --dart-define=HOMESERVER=$HOMESERVER \
            --dart-define=BUILD_MODE=release \
            --dart-define=USER1_NAME=$USER1_NAME \
            --dart-define=USER1_PW=$USER1_PW

      - name: Test binary startup
        run: |
          cd $PROJECT_PATH
          echo "--- Checking binary dependencies ---"
          ldd build/linux/x64/debug/bundle/commet 2>&1 | grep -i "not found" || echo "All shared libraries found"
          echo "--- Launching binary under xvfb-run with 15s timeout ---"
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            timeout 15 build/linux/x64/debug/bundle/commet 2>&1 || echo "Binary exited with code $?"

      - name: Run Integration Tests  ─=≡Σ((( つ＞＜)つ
        run: |
          cd $PROJECT_PATH
          scripts/integration-test.sh

      - name: Dump debug log
        if: always()
        run: |
          echo "--- Integration test debug log ---"
          cat /tmp/integration-test-debug.log 2>/dev/null || echo "No debug log found"
